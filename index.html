  <body>
    <div id="root"></div>
    <script>
      // SPA路由处理：处理GitHub Pages的404重定向
      (function(){
        // 检查URL参数中的重定向路径
        var urlParams = new URLSearchParams(window.location.search);
        var redirectPath = urlParams.get('redirect');
        
        if (redirectPath) {
          // 如果有重定向参数，使用replaceState更新URL
          history.replaceState(null, null, redirectPath);
        } else {
          // 检查sessionStorage中的重定向路径（兼容旧方案）
          var sessionRedirect = sessionStorage.getItem('spa-github-pages-redirect');
          if (sessionRedirect) {
            sessionStorage.removeItem('spa-github-pages-redirect');
            history.replaceState(null, null, sessionRedirect);
          }
        }
      })();
    </script>
  </body>
