<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - Loyal Heart of the adventure</title>
    <script>
        // SPA路由处理：将404重定向到主应用，同时保留原始路径
        var redirect = location.pathname + location.search + location.hash;
        sessionStorage.setItem('spa-github-pages-redirect', redirect);
        location.replace('/?' + new URLSearchParams({redirect: redirect}).toString());
    </script>
</head>
<body>
    <p>正在重定向到主页...</p>
</body>
</html>
